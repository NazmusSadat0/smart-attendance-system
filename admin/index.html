<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | Smart Attendance System</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- STEP 1: CONTEXT SELECTION & CUSTOMIZATION SCREEN -->
  <section id="context-screen" class="context-wrapper">
    <div class="context-card">
      <div class="brand-header">
        <i class="fa-solid fa-user-shield"></i>
        <h2>Admin Control Setup</h2>
        <p>Select or customize academic parameters to proceed</p>
      </div>

      <form id="context-form">
        <div class="form-group">
          <label for="session-select">Academic Session</label>
          <div class="input-with-btn">
            <select id="session-select" required>
              <option value="21-22">2021 - 2022 (21-22)</option>
              <option value="22-23">2022 - 2023 (22-23)</option>
              <option value="23-24">2023 - 2024 (23-24)</option>
              <option value="24-25" selected>2024 - 2025 (24-25)</option>
              <option value="25-26">2025 - 2026 (25-26)</option>
            </select>
            <button type="button" class="btn-icon" title="Add Custom Session" onclick="addCustomOption('session-select', 'Session (e.g., 26-27)')">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="term-select">Academic Term / Semester</label>
          <div class="input-with-btn">
            <select id="term-select" required>
              <option value="1.1">Year 1, Term 1 (1.1)</option>
              <option value="1.2">Year 1, Term 2 (1.2)</option>
              <option value="2.1">Year 2, Term 1 (2.1)</option>
              <option value="2.2">Year 2, Term 2 (2.2)</option>
              <option value="3.1" selected>Year 3, Term 1 (3.1)</option>
              <option value="3.2">Year 3, Term 2 (3.2)</option>
              <option value="4.1">Year 4, Term 1 (4.1)</option>
              <option value="4.2">Year 4, Term 2 (4.2)</option>
            </select>
            <button type="button" class="btn-icon" title="Add Custom Term" onclick="addCustomOption('term-select', 'Term (e.g., 5.1)')">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="section-select">Section</label>
          <div class="input-with-btn">
            <select id="section-select" required>
              <option value="A" selected>Section A</option>
              <option value="B">Section B</option>
            </select>
            <button type="button" class="btn-icon" title="Add Custom Section" onclick="addCustomOption('section-select', 'Section (e.g., C)')">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary full-width">
          Enter Admin Menu <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </section>

  <!-- STEP 2: MAIN ADMIN DASHBOARD SHELL -->
  <div id="admin-dashboard" class="dashboard-container hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-fingerprint"></i>
        <span>SmartAttend Admin</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="courses.html" data-init="initCoursesModule">
          <i class="fa-solid fa-book-open"></i> 1. Course Management
        </button>
        <button class="nav-item" data-page="teachers.html" data-init="initTeachersModule">
          <i class="fa-solid fa-chalkboard-user"></i> 2. Teacher Management
        </button>
        <button class="nav-item" data-page="students.html" data-init="initStudentsModule">
          <i class="fa-solid fa-user-graduate"></i> 3. Student Management
        </button>
        <button class="nav-item" data-page="profile.html" data-init="initProfileModule">
          <i class="fa-solid fa-id-card"></i> 4. Admin Profile
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="change-context-btn" class="btn-outline full-width">
          <i class="fa-solid fa-sliders"></i> Change Session/Term
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="active-context-badges">
          <span class="badge"><i class="fa-regular fa-calendar"></i> Session: <strong id="display-session">24-25</strong></span>
          <span class="badge"><i class="fa-solid fa-layer-group"></i> Term: <strong id="display-term">3.1</strong></span>
          <span class="badge"><i class="fa-solid fa-users-rectangle"></i> Section: <strong id="display-section">A</strong></span>
        </div>
        <div class="admin-greeting">
          <span>Logged in as <strong id="topbar-admin-name">Md. Tariqul Islam</strong></span>
        </div>
      </header>

      <!-- Dynamic Module Container (Loads courses.html, teachers.html, students.html, or profile.html) -->
      <div id="module-container" class="content-section"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
