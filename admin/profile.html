<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile | SmartAttend Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body data-page="profile">

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-fingerprint"></i>
        <span>SmartAttend Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> 1. Course Management</a>
        <a href="teachers.html" class="nav-item"><i class="fa-solid fa-chalkboard-user"></i> 2. Teacher Management</a>
        <a href="students.html" class="nav-item"><i class="fa-solid fa-user-graduate"></i> 3. Student Management</a>
        <a href="profile.html" class="nav-item active"><i class="fa-solid fa-id-card"></i> 4. Admin Profile</a>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" class="btn-outline full-width" style="display:block; text-align:center; text-decoration:none;">
          <i class="fa-solid fa-sliders"></i> Change Session/Term
        </a>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="active-context-badges">
          <span class="badge"><i class="fa-regular fa-calendar"></i> Session: <strong id="display-session">24-25</strong></span>
          <span class="badge"><i class="fa-solid fa-layer-group"></i> Term: <strong id="display-term">3.1</strong></span>
          <span class="badge"><i class="fa-solid fa-users-rectangle"></i> Section: <strong id="display-section">A</strong></span>
        </div>
        <div class="admin-greeting">
          <span>Logged in as <strong id="topbar-admin-name">Md. Tariqul Islam</strong></span>
        </div>
      </header>

      <section class="content-section">
        <div class="section-header">
          <h2>Admin Profile</h2>
        </div>

        <div class="form-card profile-card">
          <div class="profile-banner">
            <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
            <div>
              <h3 id="profile-display-name">Md. Tariqul Islam</h3>
              <p class="muted">Authorized Department Admin</p>
            </div>
          </div>

          <form id="admin-profile-form">
            <div class="form-grid">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="admin-name" required />
              </div>
              <div class="form-group">
                <label>Employee ID</label>
                <input type="text" id="admin-emp-id" required />
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="admin-email" required />
              </div>
              <div class="form-group">
                <label>Contact Number</label>
                <input type="text" id="admin-contact" required />
              </div>
              <div class="form-group full-span">
                <label>Admin Password <small class="muted">(Configured by Super Admin — Read Only)</small></label>
                <div class="input-with-btn">
                  <input type="password" id="admin-super-pass" readonly />
                  <button type="button" class="btn-icon" onclick="toggleSuperPass()" title="Show/Hide Password">
                    <i class="fa-solid fa-eye" id="pass-eye-icon"></i>
                  </button>
                </div>
              </div>
            </div>
            <button type="submit" class="btn-primary">Save Profile Changes</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
