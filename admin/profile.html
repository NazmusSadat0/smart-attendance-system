<div class="section-header">
  <h2>Admin Profile</h2>
</div>

<div class="form-card profile-card">
  <div class="profile-banner">
    <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
    <div>
      <h3 id="profile-display-name">Md. Tariqul Islam</h3>
      <p class="muted">Authorized Department Admin</p>
    </div>
  </div>

  <form id="admin-profile-form">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="admin-name" required />
      </div>
      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" id="admin-emp-id" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="admin-email" required />
      </div>
      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" id="admin-contact" required />
      </div>
      <div class="form-group full-span">
        <label>Admin Password <small class="muted">(Configured by Super Admin — Read Only)</small></label>
        <div class="input-with-btn">
          <input type="password" id="admin-super-pass" readonly />
          <button type="button" class="btn-icon" onclick="toggleSuperPass()" title="Show/Hide Password">
            <i class="fa-solid fa-eye" id="pass-eye-icon"></i>
          </button>
        </div>
      </div>
    </div>
    <button type="submit" class="btn-primary">Save Profile Changes</button>
  </form>
</div>
